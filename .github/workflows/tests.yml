name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        filament: ['4', '5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          # Run this job against the oldest supported sebastian/diff (as pulled in by PHPUnit 11)
          - php: '8.4'
            filament: '4'
            laravel: '12'
            diff: '6'

    name: PHP ${{ matrix.php }} - Filament ${{ matrix.filament }} - Laravel ${{ matrix.laravel }}${{ matrix.diff && format(' - sebastian/diff {0}', matrix.diff) || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "filament/filament:^${{ matrix.filament }}.0" --no-update --no-interaction
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update --no-interaction
          if [ -n "${{ matrix.diff }}" ]; then composer require "sebastian/diff:^${{ matrix.diff }}.0" --no-update --no-interaction; fi
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit

      - name: Static analysis
        run: vendor/bin/phpstan analyze --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  assets:
    runs-on: ubuntu-latest
    name: Compiled assets are up to date

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify dist is committed
        run: git diff --exit-code --stat -- dist
